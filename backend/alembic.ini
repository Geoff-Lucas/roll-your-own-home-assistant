# Database migrations (Alembic). The app applies them itself at startup
# (app/db.py init_db), so a deploy never needs a separate migrate step.
# Writing one after changing a model — run from backend/:
#
#   alembic revision --autogenerate -m "add servings to recipe"
#
# then read the generated file in migrations/versions/ before committing:
# autogenerate misses some things (renames look like drop + add).
# The database URL comes from app settings, not from this file.

[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
